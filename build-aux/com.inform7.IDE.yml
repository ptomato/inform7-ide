---
app-id: com.inform7.IDE
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
finish-args:
  - --socket=x11
  - --share=ipc
  - --share=network
  - --socket=pulseaudio
  - --device=dri
  - --filesystem=~/Inform/:create
  # We need blanket access to the file system because the Inform compiler needs
  # to be able to create a materials folder alongside the project folder.
  # It might make sense to limit this to the Documents folder, but without full
  # 'home' permissions, we'll get document portal URIs, which the compiler
  # cannot currently work with.
  # Issue: https://github.com/flatpak/xdg-desktop-portal/issues/463
  - --filesystem=home
command: inform7-ide
build-options:
  arch:
    x86_64:
      env:
        INFORM7_ARCH: x86_64
    i386:
      env:
        INFORM7_ARCH: i386
    aarch64:
      env:
        INFORM7_ARCH: armv6lhf
    arm:
      env:
        INFORM7_ARCH: armv6lhf
modules:
  - name: goocanvas
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/gtk-doc
      - '*.la'
    build-options:
      # Missing GOO_CANVAS_ITEM_MODEL_SIMPLE cast
      cflags: -Wno-error=incompatible-pointer-types
    config-opts:
      - --disable-introspection
      - --disable-python
      - --disable-gtk-doc
      - --disable-static
    sources:
      - type: archive
        url: "https://download.gnome.org/sources/goocanvas/\
          2.0/goocanvas-2.0.4.tar.xz"
        sha256: c728e2b7d4425ae81b54e1e07a3d3c8a4bd6377a63cffa43006045bceaa92e90
  - name: gspell
    cleanup:
      - /bin
      - /include
      - /lib/pkgconfig
      - /share/gtk-doc
      - '*.la'
    config-opts:
      - --disable-introspection
      - --disable-gtk-doc
      - --disable-vala
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gspell/1.8/gspell-1.8.4.tar.xz
        sha256: cf4d16a716e813449bd631405dc1001ea89537b8cdae2b8abfb3999212bd43b4
  - name: plist
    cleanup:
      - /include
      - /lib/libplist++*
      - /lib/pkgconfig
      - /share/man
      - '*.la'
    config-opts:
      - --without-cython
      - --without-tests
      - --without-tools
      - --disable-static
    sources:
      - type: archive
        url: "https://github.com/libimobiledevice/libplist/releases/download/\
          2.7.0/libplist-2.7.0.tar.bz2"
        sha256: 7ac42301e896b1ebe3c654634780c82baa7cb70df8554e683ff89f7c2643eb8b
  - name: gtksourceview
    cleanup:
      - /include
      - /lib/pkgconfig
      - '*.la'
      # Of the language definitions, we need the RelaxNG files and def.lang,
      # everything else is never used
      - /share/gtksourceview-4/language-specs/a*.lang
      - /share/gtksourceview-4/language-specs/b*.lang
      - /share/gtksourceview-4/language-specs/c*.lang
      - /share/gtksourceview-4/language-specs/d.lang
      - /share/gtksourceview-4/language-specs/da*.lang
      - /share/gtksourceview-4/language-specs/desktop.lang
      - /share/gtksourceview-4/language-specs/di*.lang
      - /share/gtksourceview-4/language-specs/do*.lang
      - /share/gtksourceview-4/language-specs/dp*.lang
      - /share/gtksourceview-4/language-specs/dt*.lang
      - /share/gtksourceview-4/language-specs/e*.lang
      - /share/gtksourceview-4/language-specs/f*.lang
      - /share/gtksourceview-4/language-specs/g*.lang
      - /share/gtksourceview-4/language-specs/h*.lang
      - /share/gtksourceview-4/language-specs/i*.lang
      - /share/gtksourceview-4/language-specs/j*.lang
      - /share/gtksourceview-4/language-specs/k*.lang
      - /share/gtksourceview-4/language-specs/l*.lang
      - /share/gtksourceview-4/language-specs/m*.lang
      - /share/gtksourceview-4/language-specs/n*.lang
      - /share/gtksourceview-4/language-specs/o*.lang
      - /share/gtksourceview-4/language-specs/p*.lang
      - /share/gtksourceview-4/language-specs/r*.lang
      - /share/gtksourceview-4/language-specs/s*.lang
      - /share/gtksourceview-4/language-specs/t*.lang
      - /share/gtksourceview-4/language-specs/v*.lang
      - /share/gtksourceview-4/language-specs/x*.lang
      - /share/gtksourceview-4/language-specs/y*.lang
      - /share/gtksourceview-4/language-specs/R*.lang
    buildsystem: meson
    config-opts:
      - -Dvapi=false
      - -Dgir=false
      - -Dgtk_doc=false
      - -Dglade_catalog=false
      - -Dinstall_tests=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/gtksourceview/4.8/gtksourceview-4.8.4.tar.xz
        sha256: 7ec9d18fb283d1f84a3a3eff3b7a72b09a10c9c006597b3fbabbb5958420a87d
        x-checker-data:
          type: gnome
          name: gtksourceview
          versions:
            <: 5.0.0
          version-scheme: odd-minor-is-unstable
  - name: ratify
    cleanup:
      - /include
      - /lib/girepository-1.0
      - /lib/pkgconfig
    buildsystem: meson
    config-opts:
      - -Dintrospection=disabled
      - -Dgtk_doc=disabled
      - -Dvapi=disabled
    sources:
      - type: archive
        url: "https://github.com/ptomato/ratify/releases/download/\
          v2.0.1/ratify-2.0.1.tar.xz"
        sha256: 19f44b6711a1e160614b5ae88e33caa511c128e1768e6277e18e892919a181dd
  - name: modplug
    cleanup:
      - /include
      - /lib/pkgconfig
      - '*.la'
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/modplug-xmms/libmodplug/0.8.9.0/libmodplug-0.8.9.0.tar.gz
        sha256: 457ca5a6c179656d66c01505c0d95fafaead4329b9dbaa0f997d00a3508ad9de
  - name: gstreamer-plugins-bad
    cleanup:
      - /bin
      - /include
      - /lib/libgst*.so*
      - /lib/pkgconfig
      - /share/gstreamer-1.0/encoding-profiles
    buildsystem: meson
    subdir: subprojects/gst-plugins-bad
    config-opts:
      - -Dauto_features=disabled
      - -Dnls=enabled
      - -Dmodplug=enabled
    sources:
      # Keep in sync with https://gitlab.com/freedesktop-sdk/freedesktop-sdk/
      # elements/include/gstreamer-source.yml on the applicable release branch
      - type: git
        url: https://gitlab.freedesktop.org/gstreamer/gstreamer.git
        tag: '1.28.6'
        commit: 2d3e05cbdad68e47d645f548899b432dc9fb4473
        # Workaround for 'smudge error' with git-lfs
        # https://github.com/flatpak/flatpak-github-actions/issues/159
        disable-submodules: true
  - name: libhandy
    cleanup:
      - /include
      - /lib/pkgconfig
    buildsystem: meson
    config-opts:
      - -Dgtk_doc=false
      - -Dtests=false
      - -Dexamples=false
      - -Dintrospection=disabled
      - -Dvapi=false
    sources:
      - type: archive
        url: https://download.gnome.org/sources/libhandy/1.8/libhandy-1.8.3.tar.xz
        sha256: 05b497229073ff557f10b326e074c5066f8743a302d4820ab97bcb5cd2dab087
  - name: chimara
    cleanup:
      - /include
      - /lib/pkgconfig
      - /libexec
      - /share/doc
    buildsystem: meson
    config-opts:
      - -Dbocfel=false
      - -Dnitfol=false
      - -Dplayer=false
      - -Dintrospection=false
    sources:
      - type: archive
        url: "https://github.com/chimara/Chimara/releases/download/\
          0.9.6/chimara-0.9.6.tar.xz"
        sha256: 840cac5816ee52912106a3f447e82f959ff59e0193a2c31952b2e99b33cbc5fd
  - name: rsync
    config-opts:
      # rsync is only used to install some of Inform's data files locally.
      # Build as little of it as possible.
      - --disable-acl-support
      - --disable-iconv
      - --disable-ipv6
      - --disable-locale
      - --disable-lz4
      - --disable-md2man
      - --disable-openssl
      - --disable-xattr-support
      - --disable-xxhash
      - --disable-zstd
      - --without-rrsync
    cleanup: ['*']
    sources:
      - type: archive
        url: https://download.samba.org/pub/rsync/src/rsync-3.5.1.tar.gz
        sha256: c55f9c9dc10fb8bec397b399a0fdded53cc9a2d8e30891bb0d63724d25c37bef
  - name: inform
    buildsystem: simple
    cleanup: ['*']
    sources:
      - type: git
        url: https://github.com/ganelson/inweb.git
        tag: v7.2.0
        commit: 60735b4c46de5ba8bd6ceca61b7266a76d76af35
        dest: inweb
      - type: git
        url: https://github.com/ganelson/intest.git
        tag: v2.1.0
        commit: 45b6278c633a7fa20395d17b87e91dcd3049052a
        dest: intest
      - type: git
        url: https://github.com/ganelson/inform.git
        tag: v10.1.2
        commit: 1f43d739eb5afa81241fed0abf39bb3ce0332dde
        dest: inform
      - type: file
        path: flatpak-integration-settings.mk
        dest-filename: make-integration-settings.mk
    build-commands:
      - bash inweb/scripts/first.sh linux
      - bash intest/scripts/first.sh
      # Work around UB and/or miscompilation with -O2
      # _FORTIFY_SOURCE requires optimization, so disable that too
      - |
        cd inform;
        CFLAGS="$CFLAGS -O0 -fPIE -Wp,-U_FORTIFY_SOURCE" bash scripts/first.sh
      - make -C inform forceintegration
      - make -C inform retrospective
      - cp -R inform/retrospective /app/tmp
  - name: inform7-ide
    buildsystem: meson
    sources:
      - type: git
        url: https://github.com/ptomato/inform7-ide.git
        # path: ../
        branch: main
      - type: shell
        commands:
          - cp -R /app/tmp/intools .
          - cp -R /app/tmp/data/* data/
          - cp -R /app/tmp/inform/* src/inform/
          - cp -R /app/tmp/retrospective .

...
